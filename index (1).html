<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090f">
  <meta name="description" content="Официальные социальные сети s1n0n.">
  <title>s1n0n — официальные ссылки</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090f;
      --panel: rgba(19, 19, 30, .82);
      --text: #f5f5fa;
      --muted: #a3a3b5;
      --line: rgba(255,255,255,.09);
      --accent: #9b7bff;
      --accent2: #55d6ff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 18% 15%, rgba(116, 76, 255, .19), transparent 38%),
        radial-gradient(ellipse at 85% 82%, rgba(36, 180, 255, .12), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 280px; height: 280px;
      border: 1px solid rgba(255,255,255,.035);
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { top: -150px; right: -100px; }
    body::after { bottom: -170px; left: -100px; width: 360px; height: 360px; }
    .card {
      width: min(100%, 460px);
      position: relative;
      padding: 42px 30px 25px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter: blur(18px);
      animation: appear .7s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
    .profile { text-align: center; }
    .avatar {
      width: 94px; height: 94px;
      margin: 0 auto 19px;
      display: grid; place-items: center;
      border-radius: 28px;
      background: linear-gradient(140deg, #a98cff, #5b48d8 55%, #38bce8);
      box-shadow: 0 12px 38px rgba(119, 91, 255, .3);
      font-size: 31px; font-weight: 850; letter-spacing: -2px;
      color: white; overflow: hidden;
      transform: rotate(-3deg);
    }
    .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; transform: rotate(3deg) scale(1.08); }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 38px); letter-spacing: .13em; font-weight: 850; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 20px; padding: 7px 11px;
      border: 1px solid var(--line); border-radius: 999px;
      color: #c9c8d8; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #70e3a1; box-shadow: 0 0 12px #70e3a1; }
    .links { display: grid; gap: 12px; margin-top: 32px; }
    .social-link {
      min-height: 65px;
      display: flex; align-items: center; gap: 15px;
      padding: 12px 16px;
      color: var(--text); text-decoration: none;
      border: 1px solid var(--line); border-radius: 17px;
      background: rgba(255,255,255,.035);
      transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .social-link:hover {
      transform: translateY(-3px);
      border-color: rgba(160,135,255,.55);
      background: rgba(151,125,255,.09);
      box-shadow: 0 10px 28px rgba(0,0,0,.2);
    }
    .social-link:focus-visible, .copy-button:focus-visible { outline: 2px solid var(--accent2); outline-offset: 3px; }
    .icon {
      width: 40px; height: 40px; flex: 0 0 40px;
      display: grid; place-items: center;
      border-radius: 13px;
      background: rgba(255,255,255,.075);
    }
    .icon svg { width: 21px; height: 21px; fill: currentColor; }
    .telegram .icon { color: #55c9f5; }
    .youtube .icon { color: #ff6262; }
    .twitch .icon { color: #b69aff; }
    .link-copy { min-width: 0; flex: 1; }
    .link-title { display: block; font-size: 14px; font-weight: 700; }
    .link-url { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { color: #77778b; font-size: 19px; transition: transform .2s ease, color .2s ease; }
    .social-link:hover .arrow { color: var(--text); transform: translate(2px,-2px); }
    .copy-button {
      width: 100%; margin-top: 20px; padding: 13px 16px;
      border: 1px solid rgba(155,123,255,.25); border-radius: 14px;
      background: rgba(155,123,255,.10); color: #d9d0ff;
      font: inherit; font-size: 13px; font-weight: 650;
      cursor: pointer; transition: background .2s ease, transform .2s ease;
    }
    .copy-button:hover { background: rgba(155,123,255,.18); transform: translateY(-1px); }
    .footer { margin: 24px 0 0; text-align: center; color: #6f6f82; font-size: 11px; letter-spacing: .04em; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
      padding: 11px 16px; border: 1px solid var(--line); border-radius: 12px;
      background: #1b1b29; color: var(--text); font-size: 13px;
      opacity: 0; pointer-events: none; transition: .22s ease;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 420px) { .card { padding: 34px 20px 22px; border-radius: 23px; } .social-link { min-height: 62px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const copyButton = document.getElementById("copyButton");
    const toast = document.getElementById("toast");
    let toastTimer;

    copyButton.addEventListener("click", async () => {
      const address = window.location.href;
      try {
        await navigator.clipboard.writeText(address);
        showToast("Адрес страницы скопирован");
      } catch {
        // Резервный способ для локального файла и старых браузеров.
        const field = document.createElement("textarea");
        field.value = address;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        showToast(copied ? "Адрес страницы скопирован" : "Не удалось скопировать адрес");
      }
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }
  </script>
